agent:
  max_turns: 500
  personalities: {}
  reasoning_effort: medium
  reasoning_overrides: {}
  verbose: false
browser:
  inactivity_timeout: 120
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_compact_threshold: 200000
  codex_responses_native: false
  enabled: true
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: 4096
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: 0
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
database:
  journal_mode: wal
delegation:
  max_iterations: 50
display:
  background_process_notifications: all
  bell_on_complete: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: true
  show_reasoning: false
  skin: default
  streaming: true
  tool_progress: all
group_sessions_per_user: true
kanban:
  review_dispatch: true
max_concurrent_sessions: null
memory:
  flush_min_turns: 6
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: true
model:
  base_url: https://openrouter.ai/api/v1
  default: openai/gpt-5.6-luna
  provider: openrouter
  max_tokens: 4096
platform_toolsets:
  cli:
  - hermes-cli
  discord:
  - hermes-discord
  google_chat:
  - hermes-google_chat
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  signal:
  - hermes-signal
  slack:
  - hermes-slack
  teams:
  - hermes-teams
  telegram:
  - hermes-telegram
  whatsapp:
  - hermes-whatsapp
  yuanbao:
  - hermes-yuanbao
prompt_caching:
  cache_ttl: 5m
runtime:
  nofile_soft_limit: 4096
session_reset:
  at_hour: 4
  idle_minutes: 1440
  mode: none
skills:
  creation_nudge_interval: 15
streaming:
  enabled: false
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    language: ''
    model: whisper-1
telemetry:
  shared_metrics:
    enabled: false
terminal:
  backend: ssh
  container_cpu: 1
  container_disk: 51200
  container_memory: 5120
  container_persistent: true
  cwd: .
  docker_mount_cwd_to_workspace: false
  home_mode: auto
  lifetime_seconds: 300
  ssh_host: hermes-music-dna-sandbox
  ssh_key_path: /opt/data/.ssh/id_ed25519
  ssh_port: 22
  ssh_user: root
  timeout: 180
tool_loop_guardrails:
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
    same_tool_failure: 8
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    idempotent_no_progress: 2
    same_tool_failure: 3
  warnings_enabled: true
updates:
  backup_keep: 5
  non_interactive_local_changes: stash
  pre_update_backup: false
onboarding:
  seen:
    profile_build_offered: true
